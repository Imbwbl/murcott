[package]
name = "murcott"
version = "0.1.0"
edition = "2024"
description = "murcott is a music player inspired by clementine, written in Rust."
repository = "https://github.com/Imbwbl/murcott"
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["gui", "egui", "eframe", "rust", "music", "audio", "midi"]
categories = ["music", "audio", "gui"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
eframe = "0.37.0"
egui_extras = "0.37.0"
lofty = { version = "0.25.5", features = ["serde"] }


[lints.clippy]
all = {level = "warn", priority = -1}
cargo = {level = "warn", priority = -1}
complexity = {level = "warn", priority = -1}
correctness = {level = "warn", priority = -1}
nursery = {level = "warn", priority = -1}
pedantic = {level = "warn", priority = -1}
perf = {level = "warn", priority = -1}
style = {level = "warn", priority = -1}
suspicious = {level = "warn", priority = -1}

multiple_crate_versions = "allow"

absolute_paths = "warn"
min_ident_chars = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
unused_trait_names = "warn"
unwrap_used = "deny"
unnecessary_self_imports = "warn"
